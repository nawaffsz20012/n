
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أدوات متعددة</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #2c3e50, #34495e);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      min-height: 100vh;
      background-size: cover;
      background-position: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 34px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
    }

    .tool-buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .tool-button {
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background-color: #1e1e1e;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.3s, transform 0.3s;
    }

    .tool-button:hover {
      background-color: #333;
      transform: scale(1.05);
    }

    .tool {
      display: none;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      margin-bottom: 20px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }

    .calculator {
      display: flex;
      flex-direction: column;
    }

    .calc-display {
      height: 50px;
      background: #1c1c1c;
      color: #0f0;
      font-size: 24px;
      text-align: right;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .calc-buttons button {
      padding: 20px;
      font-size: 18px;
      background-color: #222;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .calc-buttons button:hover {
      background-color: #444;
      transform: scale(1.05);
    }

    .operator {
      background-color: #333;
    }

    .equal {
      background-color: #0066cc;
    }

    .tool button {
      background-color: #0056b3;
      border-radius: 10px;
      font-size: 18px;
      transition: background 0.3s ease-in-out;
    }

    .tool button:hover {
      background-color: #004494;
    }
  </style>
  <!-- تضمين مكتبة hijri-date من jsDelivr -->
  <script src="https://cdn.jsdelivr.net/npm/hijri-date/lib/safe.min.js"></script>
</head>
<body>

  <h1>🛠️ أدوات متعددة</h1>

  <div class="tool-buttons">
    <button class="tool-button" onclick="showTool('calc')">🧮 الآلة الحاسبة</button>
    <button class="tool-button" onclick="showTool('age')">📆 حساب العمر</button>
    <button class="tool-button" onclick="showTool('currency')">💱 تحويل العملات</button>
  </div>

  <!-- الآلة الحاسبة الكلاسيكية -->
  <div id="calc" class="tool">
    <div class="calculator">
      <div id="calcDisplay" class="calc-display">0</div>
      <div class="calc-buttons">
        <button onclick="appendCalc('7')">7</button>
        <button onclick="appendCalc('8')">8</button>
        <button onclick="appendCalc('9')">9</button>
        <button class="operator" onclick="appendCalc('/')">÷</button>

        <button onclick="appendCalc('4')">4</button>
        <button onclick="appendCalc('5')">5</button>
        <button onclick="appendCalc('6')">6</button>
        <button class="operator" onclick="appendCalc('*')">×</button>

        <button onclick="appendCalc('1')">1</button>
        <button onclick="appendCalc('2')">2</button>
        <button onclick="appendCalc('3')">3</button>
        <button class="operator" onclick="appendCalc('-')">−</button>

        <button onclick="appendCalc('0')">0</button>
        <button onclick="appendCalc('.')">.</button>
        <button onclick="clearCalc()">C</button>
        <button class="operator" onclick="appendCalc('+')">+</button>

        <button class="equal" style="grid-column: span 4;" onclick="calculateResult()">=</button>
      </div>
    </div>
  </div>

  <!-- حساب العمر -->
  <div id="age" class="tool">
    <input type="date" id="birthdate">
    <button onclick="calculateAge()">احسب العمر</button>
    <div class="result" id="ageResult"></div>
  </div>

  <!-- محول العملات -->
  <div id="currency" class="tool">
    <input type="number" id="amount" placeholder="المبلغ">
    <select id="fromCurrency">
      <option value="USD">دولار أمريكي</option>
      <option value="SAR">ريال سعودي</option>
      <option value="EUR">يورو</option>
      <option value="GBP">جنيه إسترليني</option>
      <option value="AED">درهم إماراتي</option>
      <option value="JPY">ين ياباني</option>
    </select>
    <select id="toCurrency">
      <option value="SAR">ريال سعودي</option>
      <option value="USD">دولار أمريكي</option>
      <option value="EUR">يورو</option>
      <option value="GBP">جنيه إسترليني</option>
      <option value="AED">درهم إماراتي</option>
      <option value="JPY">ين ياباني</option>
    </select>
    <button onclick="convertCurrency()">تحويل</button>
    <div class="result" id="currencyResult"></div>
  </div>

  <script>
    function showTool(toolId) {
      document.querySelectorAll('.tool').forEach(tool => {
        tool.style.display = 'none';
      });
      document.getElementById(toolId).style.display = 'block';
    }

    // آلة حاسبة
    let currentCalc = '';
    function appendCalc(value) {
      if (currentCalc === '0' && value !== '.') currentCalc = '';
      currentCalc += value;
      updateCalcDisplay();
    }

    function updateCalcDisplay() {
      document.getElementById('calcDisplay').textContent = currentCalc || '0';
    }

    function clearCalc() {
      currentCalc = '';
      updateCalcDisplay();
    }

    function calculateResult() {
      try {
        currentCalc = eval(currentCalc).toString();
        updateCalcDisplay();
      } catch {
        currentCalc = 'خطأ';
        updateCalcDisplay();
      }
    }

    // حساب العمر
    function calculateAge() {
      const birthdateInput = document.getElementById('birthdate').value;
      if (!birthdateInput) {
        document.getElementById('ageResult').textContent = 'أدخل تاريخ صالح';
        return;
      }

      const birthdate = new Date(birthdateInput);
      const today = new Date();

      // حساب العمر بالميلادي
      let ageYears = today.getFullYear() - birthdate.getFullYear();
      let ageMonths = today.getMonth() - birthdate.getMonth();
      let ageDays = today.getDate() - birthdate.getDate();

      if (ageDays < 0) {
        ageMonths--;
        ageDays += 30;
      }
      if (ageMonths < 0) {
        ageYears--;
        ageMonths += 12;
      }

      document.getElementById('ageResult').innerHTML = `
        <p>🗓️ العمر بالميلادي: ${ageYears} سنة، ${ageMonths} شهر، ${ageDays} يوم</p>
      `;
    }

    // تحويل العملات
    function convertCurrency() {
      const amount = parseFloat(document.getElementById('amount').value);
      const from = document.getElementById('fromCurrency').value;
      const to = document.getElementById('toCurrency').value;

      const exchangeRates = {
        USD: { SAR: 3.75, EUR: 0.92, GBP: 0.76, AED: 3.67, JPY: 135.25 },
        SAR: { USD: 0.27, EUR: 0.24, GBP: 0.20, AED: 0.98, JPY: 36.09 },
        EUR: { USD: 1.09, SAR: 4.17, GBP: 0.83, AED: 3.99, JPY: 147.24 },
        GBP: { USD: 1.31, SAR: 5.00, EUR: 1.21, AED: 4.81, JPY: 177.36 },
        AED: { USD: 0.27, SAR: 0.98, EUR: 0.25, GBP: 0.21, JPY: 36.93 },
        JPY: { USD: 0.0074, SAR: 0.027, EUR: 0.0068, GBP: 0.0056, AED: 0.027 }
      };

      if (exchangeRates[from] && exchangeRates[from][to]) {
        const rate = exchangeRates[from][to];
        const convertedAmount = amount * rate;
        document.getElementById('currencyResult').textContent = `${amount} ${from} = ${convertedAmount.toFixed(2)} ${to}`;
      } else {
        document.getElementById('currencyResult').textContent = 'غير قادر على تحويل العملة';
      }
    }
  </script>

</body>
</html>
